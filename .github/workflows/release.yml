name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Package Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags, needed to diff against the previous release

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --build-from-source

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Baked into this release's static bundle for the LoopControl-embedded
          # deployment target (see DEVELOPER_GUIDE.md's "GitHub Integration"
          # section). The device-flow relay endpoints are relative paths since
          # they're same-origin under whatever host each LoopControl instance
          # runs at - a fixed absolute URL wouldn't work across a fleet of
          # devices each reached at their own local IP/hostname.
          NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GITHUB_CLIENT_ID }}
          NEXT_PUBLIC_GITHUB_DEVICE_CODE_ENDPOINT: ${{ vars.NEXT_PUBLIC_GITHUB_DEVICE_CODE_ENDPOINT }}
          NEXT_PUBLIC_GITHUB_DEVICE_TOKEN_ENDPOINT: ${{ vars.NEXT_PUBLIC_GITHUB_DEVICE_TOKEN_ENDPOINT }}

      - name: Prepare artifact directory
        run: |
          cp -r out release-artifact

      - name: Create start instructions
        run: |
          cat > release-artifact/START_HERE.md << 'EOF'
          # SCXML Visual Editor

          This is a static build. Serve the files with any web server:

          ```bash
          # Python (no install needed)
          python3 -m http.server 3000

          # Node.js (npx)
          npx serve .
          ```

          Or deploy the folder contents to any static host (Netlify, S3, GitHub Pages, nginx).
          EOF

      - name: Create versioned zip archive
        run: |
          cd release-artifact
          zip -r "../scxml-editor-${{ steps.version.outputs.VERSION }}.zip" .

      - name: Generate SHA256 checksum
        id: checksum
        run: |
          sha256sum "scxml-editor-${{ steps.version.outputs.VERSION }}.zip" > "scxml-editor-${{ steps.version.outputs.VERSION }}.zip.sha256"
          echo "SHA256=$(cut -d ' ' -f1 "scxml-editor-${{ steps.version.outputs.VERSION }}.zip.sha256")" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          node scripts/generate-release-notes.mjs --to "${{ steps.version.outputs.VERSION }}" --out changelog.md

      - name: Compose release notes
        run: |
          cat > release-notes.md << 'EOF'
          ## Release ${{ steps.version.outputs.VERSION }}

          Download `scxml-editor-${{ steps.version.outputs.VERSION }}.zip` below.

          **SHA256:** `${{ steps.checksum.outputs.SHA256 }}`

          **Serve it locally:**
          ```bash
          unzip scxml-editor-${{ steps.version.outputs.VERSION }}.zip
          python3 -m http.server 3000
          ```
          Or deploy the folder to any static host (Netlify, S3, GitHub Pages, nginx).

          EOF
          cat changelog.md >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "SCXML Visual Editor ${{ steps.version.outputs.VERSION }}"
          body_path: release-notes.md
          files: |
            scxml-editor-${{ steps.version.outputs.VERSION }}.zip
            scxml-editor-${{ steps.version.outputs.VERSION }}.zip.sha256
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
